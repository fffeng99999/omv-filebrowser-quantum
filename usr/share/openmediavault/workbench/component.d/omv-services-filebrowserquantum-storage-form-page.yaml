version: "1.0"
type: component
data:
  name: omv-services-filebrowserquantum-storage-form-page
  type: formPage
  config:
    request:
      service: FileBrowserQuantum
      get:
        method: getSource
        params:
          uuid: "{{ _routeParams.uuid }}"
      post:
        method: setSource
    hints:
      - type: info
        text: _("A storage source mounts a shared folder into the FileBrowser Quantum container so its files can be browsed and managed in the web interface. You can expose multiple shared folders into the container.")
        dismissible: true
        stateId: a5f20819-32d1-4e78-9a4f-71239851de92
      - type: warning
        text: _("Do not select the Compose plugin shared folder itself, a system directory, the RustFS object store or the Docker data root. Such folders are rejected or masked automatically so FileBrowser Quantum cannot read their credentials or its own state.")
        dismissible: true
        stateId: d874c932-15f0-469b-9832-4217fa3910c8
    fields:
      - type: confObjUuid
      - type: select
        name: sharedfolder
        label: _("Shared folder")
        hint: _("Shared folder exposed to FileBrowser Quantum. The container path below is filled in from it and stays editable.")
        hasEmptyOption: true
        value: ""
        store:
          proxy:
            service: FileBrowserQuantum
            get:
              method: getSharedFolderChoices
        sorters:
          - dir: asc
            prop: text
        validators:
          required: true
      - type: textInput
        name: path
        label: _("Container path")
        hint: _("Absolute path inside the container. It is filled in from the selected shared folder as '/srv/<shared folder name>' and can still be changed; leave it empty to have it generated again when saving.")
        placeholder: "/srv/<shared folder name>"
        value: ""
        hasClearButton: true
        validators:
          pattern:
            pattern: "^$|^/[^:\\s\"'\\\\]+$"
            errorData: _("Must be an absolute path without a colon or whitespace (e.g. /srv/photos).")
        modifiers:
          - type: value
            constraint:
              operator: and
              arg0:
                operator: notEmpty
                arg0:
                  prop: sharedfolder
              arg1:
                operator: or
                arg0:
                  operator: empty
                  arg0:
                    prop: path
                arg1:
                  operator: eq
                  arg0:
                    prop: path
                  arg1:
                    prop: autoPath
            typeConfig: "{{ sharedfolder }}"
      - type: hidden
        name: autoPath
        value: ""
        submitValue: false
        modifiers:
          - type: value
            deps:
              - sharedfolder
            typeConfig: "{{ sharedfolder }}"
      - type: textInput
        name: name
        label: _("Display name")
        hint: _("Optional display name for this storage source. Leave empty to use the shared folder name.")
        value: ""
      - type: checkbox
        name: readonly
        label: _("Read-only")
        hint: _("Mount the folder read-only (':ro'), preventing changes from within FileBrowser Quantum.")
        value: false
      - type: checkbox
        name: defaultEnabled
        label: _("Default enabled")
        hint: _("Automatically enable this storage source for newly created users.")
        value: true
    buttons:
      - template: cancel
        execute:
          type: url
          url: "/services/filebrowserquantum/sources"
      - template: submit
