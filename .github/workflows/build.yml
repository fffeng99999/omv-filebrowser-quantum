name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  lint:
    name: Lint (PHP + YAML + JSON + shell)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Lint PHP files
        run: |
          for f in $(find usr/share/openmediavault/engined -name '*.inc'); do
            php -l "$f"
          done
          php -l scripts/test_source_path.php
          php scripts/test_source_path.php

      - name: Validate JSON datamodels
        run: |
          for f in $(find usr/share/openmediavault/datamodels -name '*.json'); do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo "OK: ".$argv[1]."\n";' "$f"
          done

      - name: Set up Python (yamllint & test suites)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Lint workbench YAML and run test suites
        run: |
          pip install yamllint pyyaml
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            usr/share/openmediavault/workbench
          python scripts/validate-workbench.py
          python scripts/test_anti_recursion.py

      - name: Shell syntax check
        run: |
          for f in render-vars.sh debian/*.postinst debian/*.prerm debian/*.postrm \
                   usr/sbin/omv-filebrowserquantum-ctl \
                   usr/share/openmediavault/confdb/create.d/*.sh \
                   usr/share/openmediavault/confdb/migrations.d/*.sh; do
            sh -n "$f" && echo "OK: $f"
          done

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Validate gettext catalogs
        run: |
          for f in usr/share/openmediavault/locale/*.pot \
                   usr/share/openmediavault/locale/zh_CN/*.po \
                   usr/share/openmediavault/locale/zh_TW/*.po; do
            msgfmt --check -o /dev/null "$f" && echo "OK: $f"
          done

  build:
    name: Build .deb (all)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render build variables
        run: sh ./render-vars.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev debhelper build-essential fakeroot

      - name: Verify changelog matches tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(dpkg-parsechangelog -S Version | sed 's/-[0-9]*$//')
          echo "tag=$TAG changelog=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "ERROR: tag version ($TAG) != changelog version ($VER)"
            exit 1
          fi

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv ../*.deb "$GITHUB_WORKSPACE/dist/" || true
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Inspect package
        run: |
          DEB=$(ls "$GITHUB_WORKSPACE"/dist/*.deb)
          if dpkg-deb -f "$DEB" | grep -q '\${'; then
            echo "ERROR: unresolved placeholder left in package metadata (render-vars.sh not run?)"
            exit 1
          fi
          echo "== control =="; dpkg-deb -f "$DEB"
          echo "== contents (head) =="; dpkg-deb -c "$DEB" | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmediavault-filebrowser-quantum
          path: ${{ github.workspace }}/dist/*.deb

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Determine tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VER=$(dpkg-parsechangelog -l debian/changelog -S Version)
            echo "tag=v${VER}-manual-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Flatten debs
        run: |
          mkdir -p out
          find dist -name '*.deb' -exec cp {} out/ \;
          ls -l out

      - name: Create release and upload .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "openmediavault-filebrowser-quantum ${{ steps.meta.outputs.tag }}" \
            --generate-notes out/*.deb
